<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AJRNI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signin-login.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>
<header class="header"> <!--الشريط-->
    <div class="logo-area">
        <div class="logo-circle">
            <i class="fa-solid fa-box-open"></i>
        </div>
        <div class="logo-text">
            <a href="index.html"><h1>AJRNI</h1></a>
            <span>RENT • BUY • REUSE</span>
        </div>
    </div>
    <nav class="navbar"> <!-- القوائم بالشريط -->
        <a href="index.html" >الرئيسية</a>
        <a href="products.html">المنتجات</a>
        <a href="#offers">العروض</a>
        <a href="contacct.html">تواصل معنا</a>
    </nav>
    <div class="header-actions"> <!-- الأيقونات -->
        <button>
            <i class="fa-solid fa-cart-shopping"></i>
        </button>
        <button>
            <i class="fa-regular fa-heart"></i>
        </button><!--ايقونة صفحه التسجيل-->
        <a href="signin.html"class="active">
            <button>
            <i class="fa-regular fa-user"></i>
        </button></a>
    </div>
    <div class="search-box"> <!-- البحث -->

        <input type="text"
               placeholder="ابحث عن منتجاتك المفضلة...">
        <i class="fa-solid fa-magnifying-glass"></i>
    </div>
</header> 
   
    <!-- MAIN-->
    <main>
        <div class="login-card">
            <!-- LOGIN HEADER -->
            <div class="login-header">
                <h1>
                    استعادة كلمة المرور
                </h1>
                <p>أدخل بياناتك لاستعادة الوصول الى حسابك</p>
            </div>
            <!-- LOGIN FORM -->
            <form id="loginForm">
                <!-- -->
                <div class="form-group">
                    <label>
                        عنوان البريد الالكتروني
                    </label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24">
                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2">
                            </rect>
                            <path d="M3 7l9 6 9-6">
                            </path>
                        </svg>
                        <input type="email"
                            id="email"
                            placeholder="اكتب عنوان بريدك"
                            required>
                    </div>
                </div>
                <!--  -->
                <div class="form-group">
                    <label>
                        رقم الهاتف
                    </label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg"
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round">
                            <rect x="6" y="2" width="12" height="20" rx="2"/>
                            <line x1="10" y1="18" x2="14" y2="18"/>
                        </svg>
                        <input type="tel"
                            id="phone"
                            placeholder="05xxxxxxxx"
                            maxlength="10"
                            pattern="05[0-9]{8}"
                            required>
                    </div>
                </div>
                <!--BUTTON -->
                <button
                    type="submit"
                    class="login-button">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 12h13">
                        </path>
                        <path d="M13 6l6 6-6 6">
                        </path>
                    </svg>
                    استعادة
                </button><br>
<!--BUTTON -->
                <a href="login.html"><button
                    type="submit"
                    class="login-button">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 12h13">
                        </path>
                        <path d="M13 6l6 6-6 6">
                        </path>
                    </svg>
                    العودة لتسجيل الدخول
                </button></a>
            </form>
        </div>
    </main>

<!--FOOTER-->
<footer id="contact">
    <div class="footer-logo">
        <div class="logo-circle">
            <i class="fa-solid fa-box-open"></i>
        </div>
        <div>
            <h2>AJRNI</h2>
            <span>RENT • BUY • REUSE</span>
        </div>
    </div>
    <p>
        أجرني — منصة لتأجير وشراء المنتجات بسهولة وأمان
    </p>
    <p>جميع الحقوق محفوظة منصة أجرني (AJRNI) ©️ 2026 - RENT • BUY • REUSE</p>
    <div class="social">
        <a href="#">
            <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="#">
            <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a href="#">
            <i class="fa-brands fa-snapchat"></i>
        </a>
    </div>
</footer>
</body>
</html>
