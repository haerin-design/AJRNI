<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AJRNI</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --navy: #062b52;
            --dark-navy: #041f3b;
            --light-blue: #eef5fb;
            --border: #e2e8ef;
            --text: #15283b;
            --gray: #718096;
            --white: #ffffff;
        }
        body {
            font-family: "Cairo", sans-serif;
            background: #ffffff;
            color: var(--text);
        }
        main { /*اطار التسجيل*/
            min-height: calc(100vh - 102px); /*يحدد الحد الأدنى لارتفاع القسم ليملأ الشاشة تقريبًا*/
            display: flex;
            justify-content: center; /*يخلي العناصر بالمنتصف*/
            align-items: flex-start; /* يبدأ ترتيب العناصر من الأعلى */
            padding: 50px 20px 70px; /* مسافه داخليه*/
        }
        .register-card {
            width: 800px;
            background: white;
            border-radius: 18px; /*ييخلي زوايا العنصر دائريه*/
            padding: 45px 38px 35px; 
            box-shadow:
                0 15px 45px rgba(10, 83, 150, 0.10);
            border: 1px solid #e2effa; /*اطار حول العنصر*/
        }
        .register-header { /*عنوان التسجيل*/
            text-align: center;
            margin-bottom: 32px;
        }
        .register-header h1 {/*عنوان التسجيل*/
            font-size: 34px;
            color: #073b78;
            margin-bottom: 8px; /*مسافه تحت العنصر*/
        }
        .register-header p { /*عنوان التسجيل*/
            color: #517ba4;
            font-size: 16px;
        }
        .section-title { /* اختيار نوع الحساب*/
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #073b78;
        }
        .account-options { /* اختيار نوع الحساب*/
            display: grid;
            grid-template-columns: 1fr 1fr!important;
            gap: 14px;
            margin-bottom: 25px;
    
        }
        .account-option { /* اختيار نوع الحساب*/
            border: 1.5px solid #cbdff1;
            border-radius: 12px;
            min-height: 105px;
            padding: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.2s ease;
        }
        .account-option:hover { /* اختيار نوع الحساب*/
            border-color: #277bc4;
            background: #f8fcff;
        }
        .account-option.selected { /* اختيار نوع الحساب*/
            border-color: #287ac2;
            box-shadow: inset 0 0 0 1px #287ac2;
            background: #fafdff;
        }
        .radio { /* اختيار نوع الحساب*/
            width: 20px;
            height: 20px;
            border: 2px solid #bfd5e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .account-option.selected .radio { /* اختيار نوع الحساب*/
            border-color: #287ac2;
        }
        .account-option.selected .radio::after { /* اختيار نوع الحساب*/
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #287ac2;
        }
        .account-icon { /*ايقونات او رسمات نوع الحساب*/
            width: 30px;
            height: 30px;
            color: #073b78;
            flex-shrink: 0;
        }
        .account-icon svg { /*ايقونات او رسمات نوع الحساب*/
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        .account-content strong { /*نص نوع الحساب*/
            display: block;
            font-size: 15px;
            margin-bottom: 5px;
        }
        .account-content span { /*نص نوع الحساب*/
            color: #7698b8;
            font-size: 13px;
        }
        .form-group { /* حقول النموذج*/
            margin-bottom: 17px;
        }
        .form-group label { /* حقول النموذج*/
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #073b78;
        }
        .input-wrapper { /* حقول النموذج*/
            height: 52px;
            border: 1.5px solid #d1e3f3;
            border-radius: 9px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            transition: 0.2s;
        }
        .input-wrapper:focus-within { /* حقول النموذج*/
            border-color: #287ac2;
            box-shadow: 0 0 0 3px rgba(40, 122, 194, 0.08);
        }
        .input-wrapper svg { /* حقول النموذج*/
            width: 21px;
            height: 21px;
            stroke: #2870ad;
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }
        .input-wrapper input { /* حقول النموذج*/
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            padding-left: 13px;
            color: #073b78;
        }
        .input-wrapper input::placeholder { /* حقول النموذج*/
            color: #8caac6;
        }
        .password-toggle { /*اظهار واخفاء كلمه المرور*/
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .password-toggle svg { /*اظهار واخفاء كلمه المرور*/
            width: 19px;
            height: 19px;
        }
        .create-button { /*زر انشاء الحساب*/
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 28px;
            background: #062b52;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .create-button:hover { /*زر انشاء الحساب*/
            background: #062b52;
            transform: translateY(-1px);
        }
        .create-button svg { /*زر انشاء الحساب*/
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        .login-area { /*رابط تسجيل الدخول*/
            border-top: 1px solid #e1edf7;
            margin-top: 18px;
            padding-top: 18px;
            text-align: center;
            font-size: 13px;
            color: #6c8daa;
        }
        .login-area a { /*رابط تسجيل الدخول*/
            color: #073b78;
            font-weight: bold;
            text-decoration: none;
        }
        .message { /*رسائل النجاح والخطأ*/
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        .message.success { /*رسائل النجاح والخطأ*/
            display: block;
            background: #edf9f1;
            color: #21733b;
            border: 1px solid #c9ead4;
        }
        .message.error { /*رسائل النجاح والخطأ*/
            display: block;
            background: #fff1f1;
            color: #a63838;
            border: 1px solid #f0caca;
        }
            main {
                padding: 25px 12px;
            }
            .register-card {
                padding: 30px 20px;
            }
            .register-header h1 {
                font-size: 27px;
            }
            .account-options {
                grid-template-columns: 1fr;
            }
            /* الخط تحت أيقونة الشخص في صفحة التسجيل */
            .header-actions a {
                position: relative;
                color: var(--navy);
                font-size: 22px;
            }
            .header-actions a.active::after {
                content: "";
                position: absolute;
                bottom: -10px;
                right: 0;
                left: 0;
                height: 3px;
                background: var(--navy);
            }
    </style>
</head>
<body>
<header class="header"> <!--الشريط-->
    <div class="logo-area">
        <div class="logo-circle">
            <i class="fa-solid fa-box-open"></i>
        </div>
        <div class="logo-text">
            <a href="index.html"><h1>AJRNI</h1></a>
            <span>RENT • BUY • REUSE</span>
        </div>
    </div>
    <nav class="navbar"> <!-- القوائم بالشريط -->
        <a href="index.html" >الرئيسية</a>
        <a href="products.html">المنتجات</a>
        <a href="#offers">العروض</a>
        <a href="contacct.html">تواصل معنا</a>
    </nav>
    <div class="header-actions"> <!-- الأيقونات -->
        <button>
            <i class="fa-solid fa-cart-shopping"></i>
        </button>

        <button>
            <i class="fa-regular fa-heart"></i>
        </button><!--ايقونة صفحه التسجيل-->
        <a href="login.html"class="active">
            <button>
            <i class="fa-regular fa-user"></i>
        </button></a>
    </div>
    <div class="search-box"> <!-- البحث -->

        <input type="text"
               placeholder="ابحث عن منتجاتك المفضلة...">

        <i class="fa-solid fa-magnifying-glass"></i>
    </div>
</header>      
        </div> 
    <main> <!--اطار التسجيل-->
        <div class="register-card">
            <div class="register-header">
                <h1>إنشاء حساب</h1><!--عنوان انشاء الصفخه-->
                <p>أنضم الى أجرني وابدأ رحلة التأجير والاستئجار.</p>
            </div>
            <div class="section-title">:اريد ان اكون</div>
            <div class="account-options">
<!-- مربع اختيار انا عميل -->
                <div class="account-option selected"
                    id="customerOption"
                    onclick="selectAccount('customer')">
                    <div class="radio"></div>
                    <div class="account-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="7" r="3"></circle><!--رسم الشخص-->
                            <path d="M5 21
                                     C5.5 16.5 8 14 12 14
                                     C16 14 18.5 16.5 19 21">
                            </path>
                        </svg>
                    </div>
                    <div class="account-content">
                        <strong>مستأجر/ شراء منتجات</strong>
                        <span>انا عميل</span>
                    </div>
                </div>
<!-- مربع اختيار الموجر -->
                <div class="account-option"
                    id="sellerOption"
                    onclick="selectAccount('seller')">
                    <div class="radio"></div>
                    <div class="account-icon">
                        <svg viewBox="0 0 24 24"><!--رسم البيت-->
                            <path d="M4 10h16"></path>
                            <path d="M5 10v9h14v-9"></path>
                            <path d="M3 10l2-6h14l2 6"></path>
                            <path d="M9 19v-5h6v5"></path>
                        </svg>
                    </div>
                    <div class="account-content">
                        <strong>مؤجر/ بيع منتجات</strong>
                        <span>انا بائع</span>
                    </div>
                </div>
            </div>
            <form id="registerForm"><!-- نموذج التسجيل-->
                <div class="form-group"><!-- الاسم -->
                    <label>الاسم كامل</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24"><!--رسم الشخص-->
                            <circle cx="12" cy="7" r="3"></circle>
                            <path d="M5 21
                                     C5.5 16.5 8 14 12 14
                                     C16 14 18.5 16.5 19 21">
                            </path>
                        </svg>
                        <input type="text"
                            id="fullName"
                            placeholder="اكتب اسمك كاملاً"
                            required>
                    </div>
                </div>
                <div class="form-group"><!-- ايميل -->
                    <label>عنوان البريد الالكتروني</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24"><!--رسم البريد-->
                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2">
                            </rect>
                            <path d="M3 7l9 6 9-6"></path>
                        </svg>
                        <input type="email"
                            id="email"
                            placeholder="اكتب عنوان بريدك"
                            required>
                    </div>
                </div>
                <div class="form-group"><!-- الباسوورد -->
                    <label>الرمز السري</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24"><!--رسم القفل-->
                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2">
                            </rect>
                            <path d="M8 10V7a4 4 0 018 0v3"></path>
                        </svg>
                        <input type="password"
                            id="password"
                            placeholder="اكتب رمزك السري"
                            required>
                        <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('password', this)"><!--العين الي تظهر الباس-->
                            <svg viewBox="0 0 24 24"><!--رسمه العين-->
                                <path d="M2 12s3.5-6 10-6
                                         s10 6 10 6
                                         s-3.5 6-10 6
                                         s-10-6-10-6Z">
                                </path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group"><!-- خانه تاكيد الباس -->
                    <label>تأكيد الرمز السري</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24"><!--رسم القفل-->
                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2">
                            </rect>
                            <path d="M8 10V7a4 4 0 018 0v3"></path>
                        </svg>
                        <input type="password"
                            id="confirmPassword"
                            placeholder="اكد رمزك السري"required>
                        <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('confirmPassword', this)"><!--العين الي تظهر الباس-->
                            <svg viewBox="0 0 24 24"><!--رسمه العين-->
                                <path d="M2 12s3.5-6 10-6
                                         s10 6 10 6
                                         s-3.5 6-10 6
                                         s-10-6-10-6Z">
                                </path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
<!-- زر الارسال -->
                <button type="submit"
                    class="create-button">انشئ الحساب
                    <svg viewBox="0 0 24 24"><!--رسمه السهم-->
                        <path d="M5 12h13"></path>
                        <path d="M13 6l6 6-6 6"></path>
                    </svg>
                </button>
<!-- رساله لتسجيل الدخول -->
                <div id="formMessage"
                    class="message">
                </div>
            </form>
            <div class="login-area"><!-- تسجيل دخول -->
                لديك حساب؟
                <a href="">سجل الدخول</a>
            </div>
        </div>
    </main>
    <script>
        let selectedAccount = "customer";/* المسؤول عن الضغط على مستاجر وموجر*/
        function selectAccount(type) {
            selectedAccount = type;
            const customer =
                document.getElementById("customerOption");
            const seller =
                document.getElementById("sellerOption");
            if (type === "customer") {
                customer.classList.add("selected");
                seller.classList.remove("selected");
            } else {
                seller.classList.add("selected");
                customer.classList.remove("selected");
            }
        }
/* يخلي زر العين يغير كلمة المرور من مخفية إلى ظاهره والعكس*/
        function togglePassword(inputId, button) {
            const input =
                document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }
/* التحقق من تطابق كلمه المرور ونوع الحساب ورساله خطااو نجاح*/
        document
            .getElementById("registerForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();
                const name =
                    document.getElementById("fullName").value.trim();
                const email =
                    document.getElementById("email").value.trim();
                const password =
                    document.getElementById("password").value;
                const confirmPassword =
                    document.getElementById("confirmPassword").value;
                const message =
                    document.getElementById("formMessage");

                if (password !== confirmPassword) {
                    message.textContent =
                        ".الرمز السري غير متطابق";
                    message.className =
                        "message error";
                    return;
                }

                if (password.length < 6) {
                    message.textContent =
                        ".يجب ان يكون الرمز السري يحوي على8 خانات";
                    message.className =
                        "message error";
                    return;
                }
/* رساله لنجاح التسجيل*/
                const accountText =
                    selectedAccount === "customer"
                        ? "كعميل"
                        : "كبائع";
               
                message.textContent =
                    `اكتمل تسجيلك بنجاح ${accountText}.`;
                message.className =
                    "message success";
                console.log({
                    name: name,
                    email: email,
                    accountType: selectedAccount
                });
                
            });
    </script>
</body>
</html>
