<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>AJRRNI-Log In</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signin-login.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header class="header"> <!--الشريط-->
    <div class="logo-area">
        <div class="logo-circle">
            <i class="fa-solid fa-box-open"></i>
        </div>
        <div class="logo-text">
            <a href="index.html"><h1>AJRNI</h1></a>
            <span>RENT • BUY • REUSE</span>
        </div>
    </div>
    <nav class="navbar"> <!-- القوائم بالشريط -->
        <a href="index.html" >الرئيسية</a>
        <a href="products.html">المنتجات</a>
        <a href="#offers">العروض</a>
        <a href="contacct.html">تواصل معنا</a>
    </nav>
    <div class="header-actions"> <!-- الأيقونات -->
        <button>
            <i class="fa-solid fa-cart-shopping"></i>
        </button>
        <button>
            <i class="fa-regular fa-heart"></i>
        </button><!--ايقونة صفحه التسجيل-->
        <a href="signin.html"class="active">
            <button>
            <i class="fa-regular fa-user"></i>
        </button></a>
    </div>
    <div class="search-box"> <!-- البحث -->
        <input type="text"
               placeholder="ابحث عن منتجاتك المفضلة...">
        <i class="fa-solid fa-magnifying-glass"></i>
    </div>
</header>    
    <!-- MAIN-->
    <main>
        <div class="login-card">
            <!-- LOGIN HEADER -->
            <div class="login-header">
                <h1>
                    مرحباً بعودتك
                </h1>
                <p>
                    سجل الدخول الى حسابك.
                </p>
            </div>
            <!-- LOGIN FORM -->
            <form id="loginForm">
                <!-- EMAIL -->
                <div class="form-group">
                    <label>
                        عنوان البريد الالكتروني
                    </label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24">
                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2">
                            </rect>
                            <path d="M3 7l9 6 9-6">
                            </path>
                        </svg>
                        <input type="email"
                            id="email"
                            placeholder="اكتب عنوان بريدك"
                            required>
                    </div>
                </div>
                <!-- PASSWORD -->
                <div class="form-group">
                    <label>
                        كلمة المرور
                    </label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24">
                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2">
                            </rect>
                            <path
                                d="M8 10V7a4 4 0 018 0v3">
                            </path>
                        </svg>
                        <input
                            type="password"
                            id="password"
                            placeholder="اكتب كلمة المرور"
                            required>
                        <!-- SHOW PASSWORD -->
                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            title="Show password">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M2 12s3.5-6 10-6
                                    s10 6 10 6
                                    s-3.5 6-10 6
                                    s-10-6-10-6Z">
                                </path>
                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5">
                                </circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <!-- REMEMBER + FORGOT -->
                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox"
                            id="remember">
                        <span>
                            تذكرني
                        </span>
                    </label>
                    <!--                                   -->
                    <a href="forgot-password.html" 
                        class="forgot-password">
                        نسيت كلمةالمرور؟
                    </a>
                </div>
                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-button">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 12h13">
                        </path>
                        <path d="M13 6l6 6-6 6">
                        </path>
                    </svg>
                    سجل الدخول
                </button>
                <!-- MESSAGE -->
                <div
                    id="loginMessage"
                    class="message">
                </div>
            </form>
            <!-- CREATE ACCOUNT -->
            <div class="register-area">
                ليس لديك حساب؟
                <a href="signin.html">
                    انشاء حساب
                </a>
            </div>
        </div>
    </main>
<!--FOOTER-->
<footer id="contact">
    <div class="footer-logo">
        <div class="logo-circle">
            <i class="fa-solid fa-box-open"></i>
        </div>
        <div>
            <h2>AJRNI</h2>
            <span>RENT • BUY • REUSE</span>
        </div>
    </div>
    <p>
        أجرني — منصة لتأجير وشراء المنتجات بسهولة وأمان
    </p>
    <p>جميع الحقوق محفوظة منصة أجرني (AJRNI) ©️ 2026 - RENT • BUY • REUSE</p>
    <div class="social">
        <a href="#">
            <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="#">
            <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a href="#">
            <i class="fa-brands fa-snapchat"></i>
        </a>
    </div>
</footer>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        /* =====================================
           SHOW / HIDE PASSWORD
        ===================================== */

        function togglePassword() {

            const password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }



        /* =====================================
           LOGIN
        ===================================== */

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const email =
                    document
                    .getElementById("email")
                    .value
                    .trim();


                const password =
                    document
                    .getElementById("password")
                    .value;


                const remember =
                    document
                    .getElementById("remember")
                    .checked;


                const message =
                    document
                    .getElementById("loginMessage");



                /*
                   التحقق الأساسي
                */

                if (!email || !password) {

                    message.textContent =
                        "Please enter your email and password.";

                    message.className =
                        "message error";

                    return;

                }



                /*
                   هنا تسجيل دخول تجريبي.

                   لاحقًا إذا عندكم Backend
                   نربطه بقاعدة البيانات.
                */


                if (remember) {

                    localStorage.setItem(
                        "userEmail",
                        email
                    );

                }


                /*
                   تخزين حالة تسجيل الدخول
                */

                localStorage.setItem(
                    "isLoggedIn",
                    "true"
                );


                localStorage.setItem(
                    "loggedInEmail",
                    email
                );


                message.textContent =
                    "Login successful! Redirecting...";

                message.className =
                    "message success";


                /*
                   بعد ثانيتين يرجع للرئيسية
                */

                setTimeout(function() {

                    window.location.href =
                        "index.html";

                }, 1500);

            });



        /* =====================================
           SEARCH
        ===================================== */

        const searchInput =
            document.getElementById("searchInput");


        const searchResults =
            document.getElementById("searchResults");


        const products = [

            {
                name: "Designer Dress",
                category: "Fashion"
            },

            {
                name: "Canon Camera",
                category: "Electronics"
            },

            {
                name: "Travel Bag",
                category: "Travel"
            },

            {
                name: "Luxury Watch",
                category: "Accessories"
            },

            {
                name: "Leather Handbag",
                category: "Fashion"
            },

            {
                name: "Mountain Bike",
                category: "Sports"
            },

            {
                name: "Gaming Laptop",
                category: "Electronics"
            }

        ];



        searchInput.addEventListener(
            "input",
            function() {


                const query =
                    this.value
                    .trim()
                    .toLowerCase();


                searchResults.innerHTML = "";


                if (!query) {

                    searchResults
                        .classList
                        .remove("show");

                    return;

                }



                const results =
                    products.filter(product =>

                        product.name
                            .toLowerCase()
                            .includes(query)

                        ||

                        product.category
                            .toLowerCase()
                            .includes(query)

                    );



                if (results.length === 0) {

                    searchResults.innerHTML = `

                        <div class="search-result">

                            <strong>
                                No results found
                            </strong>

                            <span>
                                Try another product or brand.
                            </span>

                        </div>

                    `;

                } else {


                    results.forEach(product => {


                        const item =
                            document.createElement("div");


                        item.className =
                            "search-result";


                        item.innerHTML = `

                            <strong>
                                ${product.name}
                            </strong>

                            <span>
                                ${product.category}
                            </span>

                        `;


                        item.addEventListener(
                            "click",
                            function() {


                                searchInput.value =
                                    product.name;


                                searchResults
                                    .classList
                                    .remove("show");


                                /*
                                   لاحقًا هنا نقدر
                                   نفتح صفحة المنتج
                                */

                                alert(
                                    "Opening: " +
                                    product.name
                                );

                            }
                        );


                        searchResults.appendChild(item);

                    });

                }


                searchResults
                    .classList
                    .add("show");

            }
        );
        /* =====================================
           CLOSE SEARCH
        ===================================== */
        document.addEventListener(
            "click",
            function(event) {
                if (
                    !event.target.closest(
                        ".search-container"
                    )
                    &&
                    !event.target.closest(
                        ".search-results"
                    )
                ) {
                    searchResults
                        .classList
                        .remove("show");
                }
            }
        );
        /* =====================================
           CART COUNT
        ===================================== */
        const savedCart =
            JSON.parse(
                localStorage.getItem("cart") || "[]"
            );
        document
            .getElementById("cartCount")
            .textContent =
            savedCart.length;
    </script>
</body>
</html>
